# EMA run on Le-007-turbo, 50k checkpoint, RAW training weights from pretrained_model/ (not the EMA
# average: lerobot saves that in pretrained_model_ema/, loaded by sim_diffusion_ema_50k_ema_weights).
# Other step: sim_diffusion_ema_125k.
# Uses the diffusion code (policies/diffusion/diffusion_policy.py) with this checkpoint.
# Run with: ./run_docker.sh --policy-name sim_diffusion_ema_50k
# Paths are inside the container (checkpoints/ is mounted at /checkpoints).
ckpt_path: "/checkpoints/checkpoint_le007_diffusion_ema/sim_diffusion_ema_50k/pretrained_model"
task: "pick up the fan by its handle"
state_keys: [joint_pos, gripper_state]

# IL grasp — overrides request_topic/chunk_topic in config/params.yaml.
request_topic: "/il/grasp/request"
chunk_topic: "/il/grasp/action_chunk"

# Which obs each of the checkpoint's image features comes from, and how to encode it.
# Trained on Le-007-turbo: depth is clipped to 41–500 mm and turbo-colormapped; depth_info.json
# (copied from the dataset's meta/) carries those settings.
cameras:
  observation.images.wrist:
    source: rgb
    encoding: rgb
  observation.images.depth:
    source: depth
    encoding: depth
    info_path: "/checkpoints/checkpoint_le007_diffusion_ema/depth_info.json"

# Optional (unset = checkpoint default / auto):
# device: "cuda"
# n_action_steps: 8
# num_inference_steps: 10
# warmup: true

# Real-Time Chunking (policies/diffusion/rtc_ddim.py), used automatically while the sim's
# "IL Grasp: Real-Time Chunking" switch is on (else ignored):
# rtc:
#   enabled: true               # false = always answer with plain chunks
#   max_guidance_weight: 50.0   # inpainting strength; offline 50 keeps the overlap within ~0.01 (normalized)
#   schedule: linear            # prefix weight decay over the overlap: linear | exp | ones | zeros
